name: Aggiorna effemeridi

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica il file delle effemeridi
        env:
          EDL_USER: ${{ secrets.EARTHDATA_USER }}
          EDL_PASS: ${{ secrets.EARTHDATA_PASS }}
        run: |
          # accesso NASA Earthdata (salvato nei Secrets, mai nel codice)
          if [ -n "$EDL_USER" ]; then
            printf 'machine urs.earthdata.nasa.gov login %s password %s\n' "$EDL_USER" "$EDL_PASS" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
            echo "credenziali Earthdata presenti"
          else
            echo "credenziali Earthdata NON impostate (CDDIS verra' saltato)"
          fi
          Y=$(date -u +%Y); D=$(date -u +%j); YY=$(date -u +%y)
          TAIL="_R_${Y}${D}0000_01D_MN.rnx.gz"
          ok=0
          B="https://cddis.nasa.gov/archive/gnss/data"
          for u in \
            "$B/daily/$Y/$D/${YY}p/BRDC00IGS$TAIL" \
            "$B/daily/$Y/$D/${YY}p/BRDC00IGS_R_${Y}${D}0000_01D_MN.rnx.gz" \
            "$B/daily/$Y/brdc/brdc${D}0.${YY}n.gz" \
            "$B/hourly/$Y/$D/hour${D}0.${YY}n.gz"
          do
            case "$u" in
              *cddis.nasa.gov*) [ -z "$EDL_USER" ] && continue ;;
            esac
            echo "provo $u"
            rm -f brdc.tmp cj.txt
            if curl -fsSL --connect-timeout 15 --max-time 90 --netrc-file "$HOME/.netrc" \
                 -c cj.txt -b cj.txt -o brdc.tmp "$u" \
               && [ "$(stat -c %s brdc.tmp)" -gt 10000 ] && gzip -t brdc.tmp; then
              mv brdc.tmp BRDC.rnx.gz
              echo "OK: $u"
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then echo "nessun archivio ha risposto"; exit 1; fi

      - name: Pubblica sul ramo data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/out && cp BRDC.rnx.gz /tmp/out/
          git checkout --orphan data
          git rm -rf . -q
          cp /tmp/out/BRDC.rnx.gz .
          git add BRDC.rnx.gz
          git commit -q -m "BRDC $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin data
